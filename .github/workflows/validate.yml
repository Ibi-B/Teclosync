name: Validate CloudStream and Telegram pipelines

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q scripts tests
      - name: Run fixture-based tests
        run: python -m unittest discover -s tests -v
      - name: Build empty/default catalogue release
        run: python scripts/build_catalogs.py
      - name: Validate generated release
        run: python scripts/validate_catalog.py
