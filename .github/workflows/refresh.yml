name: Refresh Telclosync catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teclosync-r2-production
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate configuration
        run: python -m teclosync validate-config
      - name: Run controlled refresh
        env:
          TECLOSYNC_S3_BUCKET: ${{ vars.TECLOSYNC_S3_BUCKET }}
          TECLOSYNC_S3_ENDPOINT: ${{ vars.TECLOSYNC_S3_ENDPOINT }}
          TECLOSYNC_S3_REGION: ${{ vars.TECLOSYNC_S3_REGION }}
          TECLOSYNC_S3_PREFIX: ${{ vars.TECLOSYNC_S3_PREFIX }}
          TECLOSYNC_DIAGNOSTICS_PREFIX: ${{ vars.TECLOSYNC_DIAGNOSTICS_PREFIX }}
          TECLOSYNC_S3_ACCESS_KEY_ID: ${{ secrets.TECLOSYNC_S3_ACCESS_KEY_ID }}
          TECLOSYNC_S3_SECRET_ACCESS_KEY: ${{ secrets.TECLOSYNC_S3_SECRET_ACCESS_KEY }}
        run: python -m teclosync refresh --publish
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telclosync-refresh-diagnostics
          path: state/diagnostics
          retention-days: 14
