name: Verify Teclosync R2 snapshot lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile verification code
        run: python -m compileall -q teclosync scripts
      - name: Verify isolated R2 upload, restore, rotation, archive, and rollback
        env:
          TECLOSYNC_S3_BUCKET: ${{ vars.TECLOSYNC_S3_BUCKET }}
          TECLOSYNC_S3_ENDPOINT: ${{ vars.TECLOSYNC_S3_ENDPOINT }}
          TECLOSYNC_S3_REGION: ${{ vars.TECLOSYNC_S3_REGION }}
          TECLOSYNC_S3_PREFIX: telclosync/verification/${{ github.run_id }}-${{ github.run_attempt }}
          TECLOSYNC_S3_ACCESS_KEY_ID: ${{ secrets.TECLOSYNC_S3_ACCESS_KEY_ID }}
          TECLOSYNC_S3_SECRET_ACCESS_KEY: ${{ secrets.TECLOSYNC_S3_SECRET_ACCESS_KEY }}
        run: python scripts/verify_r2_roundtrip.py
      - name: Upload R2 verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telclosync-r2-verification
          path: state/diagnostics/r2-verification.json
          if-no-files-found: warn
          retention-days: 14
