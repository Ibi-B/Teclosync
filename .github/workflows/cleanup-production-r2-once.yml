name: One-time read-only Teclosync R2 verification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-production-r2-once.yml

permissions:
  contents: read

concurrency:
  group: teclosync-r2-production
  cancel-in-progress: false

jobs:
  verify-production-r2:
    if: ${{ github.event.head_commit.message == 'Run one-time read-only Teclosync R2 verification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out validated audit implementation
        uses: actions/checkout@v4
        with:
          ref: feature/teelosync-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile implementation
        run: python -m compileall -q teclosync scripts

      - name: Verify cleaned production layout and retained snapshots
        env:
          PYTHONPATH: .
          TECLOSYNC_DIAGNOSTICS_PREFIX: ${{ vars.TECLOSYNC_DIAGNOSTICS_PREFIX }}
          TECLOSYNC_S3_BUCKET: ${{ vars.TECLOSYNC_S3_BUCKET }}
          TECLOSYNC_S3_ENDPOINT: ${{ vars.TECLOSYNC_S3_ENDPOINT }}
          TECLOSYNC_S3_REGION: ${{ vars.TECLOSYNC_S3_REGION }}
          TECLOSYNC_S3_PREFIX: ${{ vars.TECLOSYNC_S3_PREFIX }}
          TECLOSYNC_S3_ACCESS_KEY_ID: ${{ secrets.TECLOSYNC_S3_ACCESS_KEY_ID }}
          TECLOSYNC_S3_SECRET_ACCESS_KEY: ${{ secrets.TECLOSYNC_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/inspect_production_r2.py

      - name: Upload read-only verification report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: teclosync-production-r2-read-only-verification
          path: state/diagnostics/
          if-no-files-found: warn
          retention-days: 14
